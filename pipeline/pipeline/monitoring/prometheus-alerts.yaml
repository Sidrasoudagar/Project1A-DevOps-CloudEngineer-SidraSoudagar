groups:
  - name: novapay-rollback-triggers
    rules:
      # Category A: High Error Rate (Immediate Rollback)
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels:
          severity: critical
          action: auto-rollback
        annotations:
          summary: "HTTP 5xx error rate is above 5%"
          description: "Auto-rollback triggered to previous stable version."

      # Category A: Pod CrashLooping (Immediate Rollback)
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          action: auto-rollback
        annotations:
          summary: "Pod is crash looping"
          
      # Category B: Latency Degradation (Escalated)
      - alert: HighLatency
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 5m
        labels:
          severity: warning
          action: escalate-and-rollback
        annotations:
          summary: "p99 latency is above 2 seconds"
          description: "On-call engineer paged. Auto-rollback in 10 minutes if unresolved."
