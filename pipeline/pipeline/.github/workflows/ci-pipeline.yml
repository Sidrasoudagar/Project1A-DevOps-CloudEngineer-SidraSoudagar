name: NovaPay CI/CD Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  # Stage 1: Source Control & Trigger
  source-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed Commits
        run: |
          git log --show-signature -1

  # Stage 2: Build & Compilation
  build:
    needs: source-control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
      - name: Build & Unit Test
        run: ./gradlew build test jacocoTestReport
      - name: Check Coverage
        run: ./scripts/check-coverage.sh --min-line 80 --min-branch 70

  # Stage 3: SAST (parallel with Stage 4)
  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Stage 4: Dependency & Container Scan (parallel with Stage 3)
  container-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: novapay-app:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Generate SBOM
        uses: anchore/sbom-action@v0

  # Stages 5–8: To be added on Days 5–8
